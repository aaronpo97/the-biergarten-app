site_name: The Biergarten App
site_url: https://github.io
repo_url: https://github.com
repo_name: the-biergarten-app

theme:
  name: material
nav:
  - Home: index.md
  - Architecture: architecture.md
  - Diagrams:
      - Website:
          - Architecture: website/diagrams/architecture.md
          - Database Schema: website/diagrams/database-schema.md
          - Deployment: website/diagrams/deployment.md
          - Auth Flows:
              - Registration: website/diagrams/auth/registration.md
              - Login: website/diagrams/auth/login.md
              - Refresh Token: website/diagrams/auth/refresh-token.md
              - Confirm User: website/diagrams/auth/confirm-user.md
              - Resend Confirmation: website/diagrams/auth/resend-confirmation.md
              - Update Username: website/diagrams/auth/update-username.md
              - Update Email: website/diagrams/auth/update-email.md
              - Update Password: website/diagrams/auth/update-password.md
              - Update Profile: website/diagrams/auth/update-profile.md
              - Delete Account: website/diagrams/auth/delete-account.md
              - Error Handling: website/diagrams/auth/error-handling.md
      - Pipeline:
          - Current:
              - Activity: pipeline/diagrams/current/activity.md
              - Class: pipeline/diagrams/current/class.md
          - Planned:
              - Activity: pipeline/diagrams/planned/activity.md
              - Class: pipeline/diagrams/planned/class.md
  - Website:
      - Getting Started: website/getting-started.md
      - Database: website/database.md
      - Docker: website/docker.md
      - Environment Variables: website/environment-variables.md
      - Testing: website/testing.md
      - Token Validation: website/token-validation.md
  - Pipeline:
      - Overview: pipeline/README.md
      - Roadmap: pipeline/ROADMAP.md
      - Ethics & Known Issues: pipeline/ETHICS-AND-KNOWN-ISSUES.md

plugins:
  - search
  - glightbox
  - panzoom:
      mermaid: true

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true
