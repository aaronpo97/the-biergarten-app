79 L2035.2689,316.9879 L2045.2689,316.9879 L2035.2689,306.9879" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="140.8926" x="1839.89" y="324.1817">Each slice owns its own:</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="170.498" x="1839.89" y="339.1304">- Controller (HTTP endpoints)</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="190.3789" x="1839.89" y="354.0792">- Commands/Queries + Handlers</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="65.749" x="1839.89" y="369.0279">- Validators</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="124.9854" x="1839.89" y="383.9766">- Repository (Dapper)</text></g><g class="entity" data-qualified-name="Feature Slices.GMN16" data-source-line="34" id="ent0017"><path d="M1206.08,321.9379 L1206.08,345.3579 L1171.35,349.3579 L1206.08,353.3579 L1206.08,376.784 A0,0 0 0 0 1206.08,376.784 L1391.0907,376.784 A0,0 0 0 0 1391.0907,376.784 L1391.0907,331.9379 L1381.0907,321.9379 L1206.08,321.9379 A0,0 0 0 0 1206.08,321.9379" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M1381.0907,321.9379 L1381.0907,331.9379 L1391.0907,331.9379 L1381.0907,321.9379" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="157.5171" x="1212.08" y="339.1317">No controller - invoked only</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="164.0107" x="1212.08" y="354.0804">via MediatR commands sent</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="95.3608" x="1212.08" y="369.0292">from other slices</text></g><g class="entity" data-qualified-name="Feature Slices.GMN19" data-source-line="39" id="ent0020"><path d="M2470,306.9879 L2470,345.3579 L2435.46,349.3579 L2470,353.3579 L2470,391.7315 A0,0 0 0 0 2470,391.7315 L2725.1714,391.7315 A0,0 0 0 0 2725.1714,391.7315 L2725.1714,316.9879 L2715.1714,306.9879 L2470,306.9879 A0,0 0 0 0 2470,306.9879" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M2715.1714,306.9879 L2715.1714,316.9879 L2725.1714,316.9879 L2715.1714,306.9879" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="169.0889" x="2476" y="324.1817">No controller and no MediatR</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="228.3506" x="2476" y="339.1304">handlers - exposes ILocationRepository</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="165.4517" x="2476" y="354.0792">directly as a plain DI service.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="190.0298" x="2476" y="369.0279">Not registered by API.Core at all;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="234.1714" x="2476" y="383.9766">only Database.Seed depends on it today</text></g><!--entity SharedContracts--><g class="entity" data-qualified-name="Shared.SharedContracts" data-source-line="48" id="ent0023"><rect fill="#FFFFFF" height="46.0986" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="148.9443" x="925.11" y="525.0579"/><rect fill="#FFFFFF" height="10" style="stroke:#000000;stroke-width:1;" width="15" x="1054.0543" y="530.0579"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="1052.0543" y="532.0579"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="1052.0543" y="536.0579"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="108.9443" x="940.11" y="55