000000;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="305.5522" x="743.72" y="874.8111">Backed by Features.Breweries' BreweryRepository</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="278.5903" x="743.72" y="892.5171">(Dapper); create/update/delete run inline SQL</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="294.6843" x="743.72" y="910.2231">inside a transaction, with optimistic concurrency</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="92.7811" x="743.72" y="927.9292">via RowVersion</text></g><!--link User to Cred--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="crowfoot" data-source-line="163" id="lnk22"><path codeLine="163" d="M2847.09,306.8841 C2847.09,345.5341 2847.09,372.7441 2847.09,372.7441 C2847.09,372.7441 2694.71,372.7441 2561.77,372.7441" fill="none" id="User-Cred" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="2843.09" x2="2851.09" y1="302.8841" y2="302.8841"/><line style="stroke:#000000;stroke-width:1;" x1="2843.09" x2="2851.09" y1="305.8841" y2="305.8841"/><line style="stroke:#000000;stroke-width:1;" x1="2847.09" x2="2847.09" y1="306.8841" y2="298.8841"/><line style="stroke:#000000;stroke-width:1;" x1="2551.77" x2="2543.77" y1="372.7441" y2="378.7441"/><line style="stroke:#000000;stroke-width:1;" x1="2551.77" x2="2543.77" y1="372.7441" y2="366.7441"/><line style="stroke:#000000;stroke-width:1;" x1="2551.77" x2="2543.77" y1="372.7441" y2="372.7441"/><ellipse cx="2557.77" cy="372.7441" fill="none" rx="4" ry="4" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="21.554" x="2710.36" y="368.6411">has</text></g><!--link User to Verify--><g class="link" data-entity-1="ent0003" data-entity-2="ent000