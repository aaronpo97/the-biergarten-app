<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="5316px" preserveAspectRatio="none" style="width:7072px;height:5316px;background:#FAFCF9;" version="1.1" viewBox="0 0 7072 5316" width="7072px" zoomAndPan="magnify"><title>The Biergarten Data Pipeline (Current &#8212; Synchronous Data Path)</title><defs/><g><rect fill="#FAFCF9" height="5316" style="stroke:none;stroke-width:1;" width="7072" x="0" y="0"/><g class="title" data-source-line="20"><text fill="#28342A" font-family="'Volkhov'" font-size="20" font-weight="bold" lengthAdjust="spacing" textLength="643.3092" x="3213.1128" y="41.38">The Biergarten Data Pipeline (Current &#8212; Synchronous Data Path)</text></g><rect fill="none" height="19.0679" style="stroke:none;stroke-width:1;" width="7039.5348" x="15" y="60.842"/><rect fill="#F2F6F0" height="5243.2679" style="stroke:#F2F6F0;stroke-width:1;" width="758.7604" x="15" y="60.842"/><ellipse cx="252.0382" cy="94.9099" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#FAFCF9" height="39.0679" rx="12.5" ry="12.5" style="stroke:#547461;stroke-width:0.5;" width="338.5547" x="82.7608" y="124.9099"/><text fill="#28342A" font-family="'DM Sans'" font-size="14" lengthAdjust="spacing" textLength="318.5547" x="92.7608" y="149.8758">Create BoundedChannel&lt;LogEntry&gt; log_channel</text><path d="M376.4188,173.9778 L376.4188,213.1136 L356.4188,217.1136 L376.4188,221.1136 L376.4188,260.2495 A0,0 0 0 0 376.4188,260.2495 L720.6075,260.2495 A0,0 0 0 0 720.6075,260.2495 L720.6075,183.9778 L710.6075,173.9778 L376.4188,173.9778 A0,0 0 0 0 376.4188,173.9778" fill="#EAF0E8" style="stroke:#547461;stroke-width:0.5;"/><path d="M710.6075,173.9778 L710.6075,183.9778 L720.6075,183.9778 L710.6075,173.9778" fill="#EAF0E8" style="stroke:#547461;stroke-width:0.5;"/><text fill="#28342A" font-family="'DM Sans'" font-size="14" lengthAdjust="spacing" te